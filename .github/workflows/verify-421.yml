name: Verify final 421-report figures
on:
  push:
    branches: [master]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python generate_manuscript_figures.py --check-only
      - run: python generate_manuscript_figures.py
      - run: python verify_figures_421.py
